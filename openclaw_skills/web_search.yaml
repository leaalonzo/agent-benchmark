name: web_search
description: "Search the web via Brave Search API. Returns title, url, description, and published_date for each result."
version: "1.0.0"
metadata:
  openclaw:
    emoji: "🌐"
    requires:
      env:
        - BRAVE_API_KEY
    envVars:
      - name: BRAVE_API_KEY
        required: true
        description: "Brave Search API subscription token"
input_schema:
  type: object
  properties:
    query:
      type: string
      description: "The search query"
    num_results:
      type: integer
      description: "Number of results to return (default 5)"
      default: 5
  required:
    - query
exec: "python3 openclaw_skills/handlers/web_search_handler.py {query} {num_results}"
