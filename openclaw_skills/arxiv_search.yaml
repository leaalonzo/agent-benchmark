name: arxiv_search
description: "Search ArXiv for recent academic papers on a topic. Returns title, authors, abstract, arxiv_id, url, and published date."
version: "1.0.0"
metadata:
  openclaw:
    emoji: "📄"
    homepage: https://export.arxiv.org/api/query
input_schema:
  type: object
  properties:
    topic:
      type: string
      description: "The search topic or query string"
    max_results:
      type: integer
      description: "Maximum number of papers to return (default 10)"
      default: 10
  required:
    - topic
exec: "python3 /workspace/openclaw_skills/handlers/arxiv_search_handler.py {topic} {max_results}"
